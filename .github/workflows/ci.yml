name: CI

# No step needs a token beyond checkout's read of this repository, so the whole
# workflow drops to the narrowest scope rather than inheriting the repository
# default.
permissions:
  contents: read

on:
  # pull_request already covers the review path, so pushes are filtered to main
  # to avoid paying twice for branches nobody has opened a PR against yet.
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the previous run's answer irrelevant, so stop paying for it.
# main is exempt: every commit there is a distinct answer worth keeping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # 24 is the LTS line. Local development runs the current line, so a failure in
  # CI that does not reproduce locally is a version gap. Two jobs install node,
  # and reading the number from here is what keeps them on the same one.
  NODE_VERSION: "24"

jobs:
  gate:
    name: gate (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        id: setup
        with:
          # The version lives in go.mod so the runner and a developer's machine
          # cannot disagree about it.
          go-version-file: gate/go.mod
          # gate declares no requires yet, so there is no go.sum on disk. Both
          # files are listed so the cache key starts covering dependencies the
          # day gate gains one.
          cache-dependency-path: |
            gate/go.mod
            gate/go.sum
      - run: go vet ./...
        working-directory: gate
      # A vet finding is not a reason to withhold the test result, so the tests
      # run anyway. They still need the toolchain, so a failed setup skips them
      # rather than reporting a second broken thing.
      - run: go test ./... -count=1
        working-directory: gate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}

  dotnet:
    name: extractor and analyzers (dotnet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        id: setup
        with:
          # The SDK version lives in dotnet/global.json so the runner and a
          # developer's machine cannot disagree about it. 8.0.x is named here
          # because it supplies the runtime the net8.0 test assemblies execute
          # on, which no project file states.
          global-json-file: dotnet/global.json
          dotnet-version: 8.0.x

      # Each suite below runs even after an earlier one fails, so one round trip
      # reports every broken suite rather than only the first. Setup is not
      # their peer, it is their precondition, so a failed SDK install skips them
      # all instead of turning one cause into three command-not-found failures.
      - run: dotnet test tests/Tvrmsmith.Analyzers.Tests/Tvrmsmith.Analyzers.Tests.csproj
        working-directory: dotnet
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      - run: dotnet test tests/Tvrmsmith.MetricGate.CSharp.Tests/Tvrmsmith.MetricGate.CSharp.Tests.csproj
        working-directory: dotnet
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      - run: ./tests/verify-severities.sh
        working-directory: dotnet
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}

  node:
    name: harness and eslint packages (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # No `version` here on purpose. The action reads the `packageManager`
          # field out of the manifest below, which is the same pin a developer's
          # corepack reads, so CI cannot drift onto a pnpm the lockfiles were
          # never written by.
          package_json_file: harness/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            harness/pnpm-lock.yaml
            packages/*/pnpm-lock.yaml

      # There is no pnpm workspace: each project carries its own lockfile and
      # installs independently. harness depends on eslint-config-tvrmsmith
      # through `link:`, which resolves to the sibling directory rather than
      # copying it, so harness reads that directory's own node_modules and the
      # two packages have to be installed before it.
      #
      # These three stay fail-fast, and the tests below wait on the last of them
      # so a failed install reports one cause rather than three directories with
      # no node_modules.
      - run: pnpm install --frozen-lockfile
        working-directory: packages/eslint-plugin-tvrmsmith
      - run: pnpm install --frozen-lockfile
        working-directory: packages/eslint-config-tvrmsmith
      - run: pnpm install --frozen-lockfile
        id: install
        working-directory: harness

      - run: pnpm test
        working-directory: packages/eslint-plugin-tvrmsmith
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm test
        working-directory: packages/eslint-config-tvrmsmith
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm test
        working-directory: harness
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}

  wiring:
    name: every suite is wired in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The jobs above name their projects one by one, which keeps install
      # order explicit but lets a seventh project land and never run. This step
      # finds the suites on disk and diffs them against a hand-maintained list.
      # It catches a suite that exists but nothing executes. It does not catch a
      # step someone deleted, because the list below is copied by hand rather
      # than derived from the jobs above.
      #
      # A suite is a package.json carrying a `test` script, a csproj referencing
      # Microsoft.NET.Test.Sdk, a Go module, or a verifier script under
      # dotnet/tests. All four discriminators are properties of a real test
      # runner, which is what keeps the fixtures out:
      # packages/eslint-config-tvrmsmith/test/fixture-package has no scripts,
      # and dotnet/tests/Consumer exists to emit diagnostics rather than to be
      # run.
      - name: Compare the suites on disk against the hand-maintained list
        run: |
          set -euo pipefail

          expected="$RUNNER_TEMP/expected"
          found="$RUNNER_TEMP/found"

          cat > "$expected" <<'EOF'
          dotnet/tests/Tvrmsmith.Analyzers.Tests/Tvrmsmith.Analyzers.Tests.csproj
          dotnet/tests/Tvrmsmith.MetricGate.CSharp.Tests/Tvrmsmith.MetricGate.CSharp.Tests.csproj
          dotnet/tests/verify-severities.sh
          gate/go.mod
          harness/package.json
          packages/eslint-config-tvrmsmith/package.json
          packages/eslint-plugin-tvrmsmith/package.json
          EOF

          {
            # node prints the path when the manifest has a `test` script and
            # says nothing when it does not, so a manifest node cannot parse
            # exits non-zero and aborts the step naming the file instead of
            # quietly dropping out of the set.
            git ls-files '*/package.json' 'package.json' \
              | while IFS= read -r manifest; do
                  node -e 'const p = process.argv[1];
                           const src = require("fs").readFileSync(p, "utf8");
                           let m;
                           try { m = JSON.parse(src); }
                           catch (e) { throw new Error(p + ": " + e.message); }
                           if (m.scripts && m.scripts.test) console.log(p);' "$manifest"
                done
            # git grep takes the pathspec itself, so no path splitting, and
            # exit 1 means no match while anything else is a real failure.
            git grep -l 'Microsoft\.NET\.Test\.Sdk' -- '*.csproj' || [ "$?" -eq 1 ]
            git ls-files '*/go.mod' 'go.mod'
            git ls-files 'dotnet/tests/*.sh'
          } | LC_ALL=C sort > "$found"

          # diff exits 1 for a real difference and 2 or more when it could not
          # do the comparison at all, so the two get different messages.
          status=0
          diff -u "$expected" "$found" || status=$?

          if [ "$status" -eq 1 ]; then
            echo
            echo "The suites on disk differ from the ones .github/workflows/ci.yml runs."
            echo "A line only in 'found' is a suite nothing executes: add it to a job above,"
            echo "and to the expected list here. A line only in 'expected' has moved or gone."
            exit 1
          elif [ "$status" -ne 0 ]; then
            echo "Comparing the two suite lists failed with exit $status, so this step" >&2
            echo "proved nothing about the wiring." >&2
            exit "$status"
          fi

          echo "All $(wc -l < "$expected") suites are wired in."
